<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Davi 💚</title>

<style>
body {
  margin: 0;
  height: 100vh;
  font-family: Arial;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  color: white;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: url("foto.jpg") center/cover no-repeat;
  filter: blur(18px) brightness(0.35);
  transform: scale(1.1);
  z-index: -1;
}

/* overlay */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 10;
}

.card {
  width: 320px;
  background: rgba(20,20,20,0.75);
  backdrop-filter: blur(10px);
  border-radius: 20px;
  padding: 20px;
  text-align: center;
  opacity: 0;
  transform: translateY(20px);
  transition: 0.6s;
}

.card.show {
  opacity: 1;
  transform: translateY(0);
}

.foto {
  width: 100%;
  height: 250px;
  object-fit: cover;
  border-radius: 14px;
}

h1 { font-size: 18px; }
p { font-size: 13px; color: #ccc; }

.contador {
  font-size: 12px;
  margin-top: 10px;
  color: #aaa;
}

.btn {
  margin-top: 15px;
  background: #1db954;
  border: none;
  padding: 10px;
  border-radius: 10px;
  color: white;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="overlay" id="overlay">
  <h2>clique para começar 💚</h2>
</div>

<div class="card" id="card">

  <img src="foto.jpg" class="foto">

  <h1>Eu te amo 💚</h1>
  <p>amo você demais</p>

  <div class="contador" id="contador"></div>

  <button class="btn" onclick="tocar()">tocar música 💚</button>

  <audio id="audio" src="musica.mp3"></audio>

</div>

<script>

let iniciou = false;

/* 💚 START 100% À PROVA DE BUG */
function iniciar() {
  if (iniciou) return;
  iniciou = true;

  document.getElementById("overlay").style.display = "none";
  document.getElementById("card").classList.add("show");
}

/* garante clique em QUALQUER celular */
document.getElementById("overlay").onclick = iniciar;
document.getElementById("overlay").ontouchstart = iniciar;

/* música */
function tocar() {
  const audio = document.getElementById("audio");
  audio.play();
}

/* contador simples e estável */
function contador() {
  const inicio = new Date(2026, 2, 14);
  const agora = new Date();

  const dias = Math.floor((agora - inicio) / (1000 * 60 * 60 * 24));

  document.getElementById("contador").innerText =
    `💚 ${dias} dias juntos`;
}

contador();
setInterval(contador, 60000);

</script>

</body>
</html>
