<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Davi 💚</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  height: 100vh;
  font-family: Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  overflow: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: url("foto.jpg") center/cover no-repeat;
  filter: blur(18px) brightness(0.35);
  transform: scale(1.1);
  z-index: -1;
}

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  cursor: pointer;
  transition: opacity 0.5s ease;
}

.overlay.hide {
  opacity: 0;
  pointer-events: none;
}

.card {
  background: rgba(18,18,18,0.75);
  backdrop-filter: blur(12px);
  padding: 22px;
  border-radius: 20px;
  width: min(90vw, 340px);
  text-align: center;
  box-shadow: 0 10px 40px rgba(0,0,0,0.6);
  opacity: 0;
  transform: translateY(20px);
  transition: 0.8s ease;
  border: 1px solid rgba(255,255,255,0.08);
}

.card.show {
  opacity: 1;
  transform: translateY(0);
}

.foto {
  width: 100%;
  height: 260px;
  object-fit: cover;
  border-radius: 14px;
  cursor: pointer;
}

.msg-foto {
  position: absolute;
  top: 90px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.6);
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 13px;
  opacity: 0;
  transition: 0.3s;
}

.msg-foto.show {
  opacity: 1;
}

h1 { font-size: 18px; margin: 15px 0 5px; }
p { font-size: 13px; color: #d1d1d1; }

.tocando { font-size: 12px; color: #1db954; margin-top: 10px; }

.contador { margin-top: 8px; font-size: 12px; color: #b3b3b3; }

.progress-container {
  width: 100%; height: 6px;
  background: rgba(255,255,255,0.15);
  border-radius: 10px;
  margin-top: 12px;
  overflow: hidden;
}

.progress {
  height: 100%; width: 0%;
  background: #1db954;
}

.player-controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  margin-top: 12px;
}

.btn {
  background: #1db954;
  border: none;
  color: white;
  padding: 8px 10px;
  border-radius: 10px;
  cursor: pointer;
}

.play-button {
  width: 55px;
  height: 55px;
  background: #1db954;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.triangle {
  width: 0;
  height: 0;
  border-left: 16px solid white;
  border-top: 9px solid transparent;
  border-bottom: 9px solid transparent;
}

.pause { display: flex; gap: 4px; }
.bar { width: 5px; height: 16px; background: white; }

.coracao {
  position: fixed;
  font-size: 16px;
  animation: subir 4s linear forwards;
  pointer-events: none;
}

@keyframes subir {
  0% { transform: translateY(0); opacity: 1; }
  100% { transform: translateY(-600px); opacity: 0; }
}

</style>
</head>
<body>

<div class="overlay" id="overlay">
  <h2>clique para começar 💚</h2>
</div>

<div class="card" id="card">

  <div style="position:relative;">
    <img src="foto.jpg" class="foto" id="foto">
    <div class="msg-foto" id="msgFoto">eu te amo 💚</div>
  </div>

  <h1>Eu te amo 🤍</h1>
  <p>amo amar você, de verdade… é tudo pra mim 🤍</p>

  <div class="tocando" id="musicaNome">tocando agora</div>

  <div class="contador" id="tempoJuntos"></div>

  <audio id="audio"></audio>

  <div class="progress-container">
    <div class="progress" id="progress"></div>
  </div>

  <div class="player-controls">
    <button class="btn" id="prev">⏮</button>

    <div class="play-button" id="play">
      <div id="icone" class="triangle"></div>
    </div>

    <button class="btn" id="next">⏭</button>
  </div>

  <button class="btn" id="hearts">💖 modo corações</button>

</div>

<script>
let tocando = false;
let index = 0;

const playlist = [
  { nome: "Papo de Undaia", src: "musica1.mp3" },
  { nome: "Outra música", src: "musica2.mp3" }
];

const audio = document.getElementById("audio");
const progress = document.getElementById("progress");
const nome = document.getElementById("musicaNome");

function loadTrack(i){
  audio.src = playlist[i].src;
  nome.innerText = "tocando agora: " + playlist[i].nome;
}

function entrar(){
  document.getElementById("overlay").classList.add("hide");
  document.getElementById("card").classList.add("show");
}

function toggleMusica(){
  const icone = document.getElementById("icone");
  tocando = !tocando;

  if(tocando){
    audio.play().catch(()=>{});
    icone.className = "pause";
    icone.innerHTML = '<div class="bar"></div><div class="bar"></div>';
    updateProgress();
  } else {
    audio.pause();
    icone.className = "triangle";
    icone.innerHTML = "";
  }
}

function updateProgress(){
  if(!tocando || !audio.duration) return;
  progress.style.width = (audio.currentTime / audio.duration) * 100 + "%";
  requestAnimationFrame(updateProgress);
}

function nextTrack(){
  index = (index + 1) % playlist.length;
  loadTrack(index);
  if(tocando) audio.play();
}

function prevTrack(){
  index = (index - 1 + playlist.length) % playlist.length;
  loadTrack(index);
  if(tocando) audio.play();
}

function atualizarTempo(){
  const inicio = new Date(2026,2,14);
  const agora = new Date();
  const diff = agora - inicio;

  const segundos = Math.floor(diff/1000);
  const minutos = Math.floor(segundos/60);
  const horas = Math.floor(minutos/60);
  const dias = Math.floor(horas/24);
  const meses = Math.floor(dias/30);
  const anos = Math.floor(meses/12);

  document.getElementById("tempoJuntos").innerText =
  `💚 ${anos}a ${meses%12}m ${dias%30}d ${horas%24}h ${minutos%60}m ${segundos%60}s`;
}

function criarCoracao(){
  const c = document.createElement("div");
  c.classList.add("coracao");
  c.innerText = "💗";
  c.style.left = Math.random()*window.innerWidth + "px";
  document.body.appendChild(c);
  setTimeout(()=>c.remove(),4000);
}

function toggleHearts(){
  for(let i=0;i<10;i++) setTimeout(criarCoracao,i*100);
}

function mostrarMensagem(){
  const msg = document.getElementById("msgFoto");
  msg.classList.add("show");
  setTimeout(()=>msg.classList.remove("show"),2000);
  for(let i=0;i<6;i++) setTimeout(criarCoracao,i*120);
}

/* EVENTOS (sem bug) */
window.addEventListener("load",()=>{
  loadTrack(index);
  atualizarTempo();
  setInterval(atualizarTempo,1000);

  document.getElementById("overlay").addEventListener("click",entrar);
  document.getElementById("play").addEventListener("click",toggleMusica);
  document.getElementById("next").addEventListener("click",nextTrack);
  document.getElementById("prev").addEventListener("click",prevTrack);
  document.getElementById("hearts").addEventListener("click",toggleHearts);
  document.getElementById("foto").addEventListener("click",mostrarMensagem);
});
</script>

</body>
</html>
