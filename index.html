<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Davi 💚</title>

<style>
body {
  margin: 0;
  height: 100vh;
  font-family: Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  overflow: hidden;
}

/* 🌫️ fundo */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: url("foto.jpg") center/cover no-repeat;
  filter: blur(22px) brightness(0.35);
  transform: scale(1.1);
  z-index: -1;
}

/* 💥 overlay */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
  flex-direction: column;
  cursor: pointer;
}

/* 💚 card */
.card {
  background: rgba(18,18,18,0.75);
  backdrop-filter: blur(12px);
  padding: 25px;
  border-radius: 20px;
  width: 320px;
  text-align: center;
  box-shadow: 0 10px 40px rgba(0,0,0,0.6);
  opacity: 0;
  transform: translateY(20px);
  transition: 0.8s ease;
}

.card.show {
  opacity: 1;
  transform: translateY(0);
}

/* 📸 foto */
.foto {
  width: 100%;
  height: 260px;
  object-fit: cover;
  border-radius: 14px;
  cursor: pointer;
  position: relative;
}

/* 💬 mensagem foto */
.msg-foto {
  position: absolute;
  top: 90px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.6);
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 13px;
  display: none;
}

/* textos */
h1 { font-size: 18px; margin: 15px 0 5px; }
p { font-size: 13px; color: #d1d1d1; }

.tocando {
  font-size: 12px;
  color: #1db954;
  margin-top: 10px;
}

.contador {
  margin-top: 10px;
  font-size: 12px;
  color: #b3b3b3;
}

/* ▶️ player */
.play-button {
  margin: 20px auto;
  width: 62px;
  height: 62px;
  background: #1db954;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: 0.2s;
}

.play-button:active {
  transform: scale(0.92);
}

.triangle {
  width: 0;
  height: 0;
  border-left: 18px solid white;
  border-top: 10px solid transparent;
  border-bottom: 10px solid transparent;
}

.pause {
  display: flex;
  gap: 4px;
}

.bar {
  width: 5px;
  height: 18px;
  background: white;
}

/* 💗 corações */
.coracao {
  position: fixed;
  bottom: 10px;
  font-size: 16px;
  color: rgba(255, 105, 135, 0.9);
  animation: subir 3s ease-out forwards;
  pointer-events: none;
  z-index: 999;
}

@keyframes subir {
  0% { transform: translateY(0); opacity: 1; }
  100% { transform: translateY(-450px); opacity: 0; }
}

/* iframe */
iframe {
  margin-top: 15px;
  border-radius: 12px;
}
</style>
</head>

<body>

<div class="overlay" onclick="entrar()">
  <h2>clique para começar 💚</h2>
</div>

<div class="card" id="card">

  <div style="position:relative;">
    <img src="foto.jpg" class="foto" onclick="mostrarMensagem()">
    <div class="msg-foto" id="msgFoto">eu te amo 💚</div>
  </div>

  <h1>Eu te amo 🤍</h1>

  <p>amo amar você, de verdade… é tudo pra mim 🤍</p>

  <div class="tocando">tocando agora: Papo de Undaia kkk 💚</div>

  <div class="contador" id="contador"></div>

  <div class="play-button" onclick="toggleMusica()">
    <div id="icone" class="triangle"></div>
  </div>

  <iframe
    src="https://open.spotify.com/embed/track/4HQ4VFKOJRnTGZlYOOgrr6"
    width="100%" height="80">
  </iframe>

</div>

<script>

let tocando = false;

/* entrar */
function entrar() {
  document.querySelector(".overlay").style.display = "none";
  document.getElementById("card").classList.add("show");
}

/* mensagem foto */
function mostrarMensagem() {
  const msg = document.getElementById("msgFoto");
  msg.style.display = "block";

  for (let i = 0; i < 7; i++) {
    setTimeout(criarCoracao, i * 120);
  }

  setTimeout(() => {
    msg.style.display = "none";
  }, 2000);
}

/* player */
function toggleMusica() {
  const icone = document.getElementById("icone");

  tocando = !tocando;

  if (tocando) {
    icone.className = "pause";
    icone.innerHTML = '<div class="bar"></div><div class="bar"></div>';

    for (let i = 0; i < 10; i++) {
      setTimeout(criarCoracao, i * 120);
    }

  } else {
    icone.className = "triangle";
    icone.innerHTML = "";
  }
}

/* corações */
function criarCoracao() {
  const coracao = document.createElement("div");
  coracao.classList.add("coracao");
  coracao.innerText = "💗";

  coracao.style.left = Math.random() * window.innerWidth + "px";

  document.body.appendChild(coracao);

  setTimeout(() => coracao.remove(), 3000);
}

/* 💚 contador ARRUMADO */
function atualizarContador() {
  const inicio = new Date(2026, 3, 14); // mês começa do 0
  const agora = new Date();

  const dias = Math.floor((agora - inicio) / (1000 * 60 * 60 * 24));

  document.getElementById("contador").innerText =
    `💚 ${dias} dias juntos`;
}

/* 🔥 IMPORTANTE: chamar função */
atualizarContador();

</script>

</body>
</html>
