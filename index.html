<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Davi 💚</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  overflow: hidden;
}

/* 🌫️ fundo estilo Spotify */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: url("foto.jpg") center/cover no-repeat;
  filter: blur(28px) brightness(0.35);
  transform: scale(1.2);
  z-index: -1;
}

/* overlay inicial */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  cursor: pointer;
  font-size: 14px;
  letter-spacing: 1px;
}

/* 💚 card estilo Spotify premium */
.card {
  width: 90%;
  max-width: 360px;
  background: rgba(20,20,20,0.65);
  backdrop-filter: blur(18px);
  border-radius: 28px;
  padding: 22px;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  opacity: 0;
  transform: translateY(25px);
  transition: 0.9s ease;
}

.card.show {
  opacity: 1;
  transform: translateY(0);
}

/* 📸 foto estilo álbum */
.foto {
  width: 100%;
  height: 260px;
  object-fit: cover;
  border-radius: 18px;
  cursor: pointer;
  box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}

/* mensagem na foto */
.msg-foto {
  position: absolute;
  top: 110px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.6);
  padding: 8px 12px;
  border-radius: 14px;
  font-size: 12px;
  display: none;
  animation: fade 0.3s ease;
}

@keyframes fade {
  from { opacity: 0; transform: translate(-50%, 10px); }
  to { opacity: 1; }
}

/* textos */
h1 {
  font-size: 18px;
  margin: 14px 0 5px;
}

p {
  font-size: 13px;
  color: #cfcfcf;
}

/* tocando agora */
.tocando {
  font-size: 11px;
  color: #1db954;
  margin-top: 10px;
}

/* contador */
.contador {
  margin-top: 8px;
  font-size: 12px;
  color: #aaa;
}

/* ▶️ botão play estilo Spotify */
.play-button {
  margin: 18px auto;
  width: 58px;
  height: 58px;
  background: #1db954;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: 0.2s;
  box-shadow: 0 10px 20px rgba(29,185,84,0.3);
}

.play-button:active {
  transform: scale(0.92);
}

.triangle {
  width: 0;
  height: 0;
  border-left: 18px solid white;
  border-top: 10px solid transparent;
  border-bottom: 10px solid transparent;
}

.pause {
  display: flex;
  gap: 4px;
}

.bar {
  width: 4px;
  height: 18px;
  background: white;
  border-radius: 2px;
}

/* 💗 corações flutuando */
.coracao {
  position: fixed;
  bottom: 0;
  font-size: 16px;
  animation: subir 3.5s linear forwards;
  pointer-events: none;
  z-index: 999;
}

@keyframes subir {
  0% { transform: translateY(0); opacity: 1; }
  100% { transform: translateY(-500px); opacity: 0; }
}

/* responsivo celular */
@media (max-width: 480px) {
  .foto { height: 220px; }
  h1 { font-size: 16px; }
  p { font-size: 12px; }
}

</style>
</head>

<body>

<div class="overlay" onclick="entrar()">
  <h2>clique para entrar 💚</h2>
</div>

<div class="card" id="card">

  <div style="position:relative;">
    <img src="foto.jpg" class="foto" onclick="mostrarMensagem()">
    <div class="msg-foto" id="msgFoto">eu te amo 💚</div>
  </div>

  <h1>Eu te amo 🤍</h1>
  <p>amo amar você… é meu lugar favorito 🤍</p>

  <div class="tocando">tocando agora: Papo de Undaia 💚</div>

  <div class="contador" id="contador"></div>

  <div class="play-button" onclick="toggleMusica()">
    <div id="icone" class="triangle"></div>
  </div>

  <iframe
    src="https://open.spotify.com/embed/track/4HQ4VFKOJRnTGZlYOOgrr6"
    width="100%" height="80"
    style="border:none;border-radius:12px;">
  </iframe>

</div>

<script>

let tocando = false;

/* entrar */
function entrar() {
  document.querySelector(".overlay").style.display = "none";
  document.getElementById("card").classList.add("show");
}

/* mensagem foto */
function mostrarMensagem() {
  const msg = document.getElementById("msgFoto");
  msg.style.display = "block";

  for (let i = 0; i < 8; i++) {
    setTimeout(criarCoracao, i * 100);
  }

  setTimeout(() => {
    msg.style.display = "none";
  }, 2000);
}

/* play */
function toggleMusica() {
  const icone = document.getElementById("icone");
  tocando = !tocando;

  if (tocando) {
    icone.className = "pause";
    icone.innerHTML = '<div class="bar"></div><div class="bar"></div>';

    for (let i = 0; i < 12; i++) {
      setTimeout(criarCoracao, i * 120);
    }

  } else {
    icone.className = "triangle";
    icone.innerHTML = "";
  }
}

/* corações */
function criarCoracao() {
  const c = document.createElement("div");
  c.classList.add("coracao");
  c.innerText = "💚";
  c.style.left = Math.random() * window.innerWidth + "px";
  document.body.appendChild(c);
  setTimeout(() => c.remove(), 3500);
}

/* contador */
function atualizarContador() {
  const inicio = new Date(2026, 2, 14); // março certo
  const agora = new Date();

  const dias = Math.floor((agora - inicio) / (1000 * 60 * 60 * 24));

  document.getElementById("contador").innerText =
    `💚 ${dias} dias juntos`;
}

atualizarContador();
setInterval(atualizarContador, 60000);

</script>

</body>
</html>
