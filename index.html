<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Davi 💚</title>

<style>
body {
  margin: 0;
  height: 100vh;
  font-family: Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  overflow: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: url("foto.jpg") center/cover no-repeat;
  filter: blur(20px) brightness(0.4);
  z-index: -1;
}

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
  flex-direction: column;
  cursor: pointer;
  transition: 1s;
}

.card {
  background: rgba(18,18,18,0.8);
  backdrop-filter: blur(10px);
  padding: 25px;
  border-radius: 20px;
  width: 300px;
  text-align: center;
  box-shadow: 0 10px 40px rgba(0,0,0,0.6);
  opacity: 0;
  transform: translateY(20px);
  transition: 1s;
}

.card.show {
  opacity: 1;
  transform: translateY(0);
}

.foto {
  width: 100%;
  height: 250px;
  object-fit: cover;
  border-radius: 12px;
  position: relative;
}

.msg-foto {
  position: absolute;
  top: 90px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.6);
  padding: 10px 15px;
  border-radius: 10px;
  font-size: 13px;
  display: none;
}

h1 { font-size: 18px; margin: 15px 0 5px; }

p { font-size: 13px; color: #d1d1d1; }

.tocando {
  font-size: 12px;
  color: #1db954;
  margin-top: 10px;
}

.contador {
  margin-top: 10px;
  font-size: 12px;
  color: #b3b3b3;
}

.play-button {
  margin: 20px auto;
  width: 60px;
  height: 60px;
  background: #1db954;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.triangle {
  width: 0;
  height: 0;
  border-left: 18px solid white;
  border-top: 10px solid transparent;
  border-bottom: 10px solid transparent;
}

.pause {
  display: flex;
  gap: 4px;
}

.bar {
  width: 5px;
  height: 18px;
  background: white;
}

iframe {
  margin-top: 15px;
  border-radius: 12px;
}

.coracao {
  position: fixed;
  bottom: 0;
  font-size: 14px;
  color: rgba(255, 77, 109, 0.6);
  animation: subir 4s linear forwards;
}

@keyframes subir {
  0% { transform: translateY(0); opacity: 0; }
  20% { opacity: 1; }
  100% { transform: translateY(-300px); opacity: 0; }
}
</style>
</head>

<body>

<div class="overlay" onclick="entrar()">
  <h2>clique para começar 💚</h2>
</div>

<div class="card" id="card">

<div style="position:relative;">
  <img src="foto.jpg" class="foto" onclick="mostrarMensagem()">
  <div class="msg-foto" id="msgFoto">eu te amo 💚</div>
</div>

<h1>Eu te amo 🤍</h1>

<p>
amo amar você, de verdade… é tudo pra mim 🤍
</p>

<div class="tocando">tocando agora: Papo de undaiá kkkk ❤️</div>

<div class="contador" id="contador"></div>

<div class="play-button" onclick="toggleMusica()">
  <div id="icone" class="triangle"></div>
</div>

<iframe
  src="https://open.spotify.com/embed/track/4HQ4VFKOJRnTGZlYOOgrr6"
  width="100%" height="80">
</iframe>

</div>

<script>

function entrar() {
  document.querySelector(".overlay").style.display = "none";
  document.getElementById("card").classList.add("show");
}

/* 💚 MENSAGEM NA FOTO */
function mostrarMensagem() {
  const msg = document.getElementById("msgFoto");
  msg.style.display = "block";

  for (let i = 0; i < 6; i++) {
    setTimeout(criarCoracao, i * 200);
  }

  setTimeout(() => {
    msg.style.display = "none";
  }, 2500);
}

/* 🎧 PLAYER */
function toggleMusica() {
  const icone = document.getElementById("icone");

  if (icone.className === "triangle") {
    icone.className = "pause";
    icone.innerHTML = '<div class="bar"></div><div class="bar"></div>';
  } else {
    icone.className = "triangle";
    icone.innerHTML = "";
  }
}

/* 💗 CORAÇÕES */
function criarCoracao() {
  const coracao = document.createElement("div");
  coracao.classList.add("coracao");
  coracao.innerText = "💗";
  coracao.style.left = Math.random() * window.innerWidth + "px";
  document.body.appendChild(coracao);

  setTimeout(() => coracao.remove(), 4000);
}

/* ⏳ CONTADOR */
function atualizarContador() {
  const inicio = new Date("2026-03-14"); 
  const agora = new Date();

  const diff = agora - inicio;

  const dias = Math.floor(diff / (1000 * 60 * 60 * 24));

  document.getElementById("contador").innerText =
    dias + " dias juntos 💚";
}

setInterval(atualizarContador, 1000);
atualizarContador();

</script>

</body>
</html>
