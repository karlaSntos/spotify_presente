<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Spotify Casal 💚</title>

<style>
body {
  margin: 0;
  height: 100vh;
  font-family: Arial, sans-serif;
  overflow: hidden;
  color: white;
}

/* 🌫 fundo */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: url("foto.jpg") center/cover no-repeat;
  filter: blur(25px) brightness(0.35);
  transform: scale(1.1);
  z-index: -1;
}

/* 💚 tela */
.spotify {
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

/* card */
.card {
  width: 320px;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(15px);
  padding: 20px;
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 10px 40px rgba(0,0,0,0.6);
}

/* capa */
.capa {
  width: 100%;
  border-radius: 15px;
}

/* textos */
h2 { margin: 10px 0 5px; }
.musica {
  color: #1db954;
  font-size: 13px;
}

/* barra */
.barra {
  width: 100%;
  height: 4px;
  background: #333;
  border-radius: 10px;
  margin: 10px 0;
  overflow: hidden;
}

.progresso {
  width: 45%;
  height: 100%;
  background: #1db954;
}

/* botão */
.play {
  margin-top: 10px;
  width: 55px;
  height: 55px;
  background: #1db954;
  border-radius: 50%;
  border: none;
  color: white;
  font-size: 18px;
  cursor: pointer;
}

/* contador */
.contador {
  margin-top: 10px;
  font-size: 12px;
  color: #b3b3b3;
}

/* 💌 carta */
.carta {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  display: none;
  align-items: center;
  justify-content: center;
}

.carta-box {
  background: #111;
  padding: 20px;
  border-radius: 15px;
  width: 300px;
  text-align: center;
}

/* botão carta */
.btn {
  margin-top: 10px;
  background: #ff4d6d;
  border: none;
  padding: 8px 12px;
  border-radius: 10px;
  color: white;
  cursor: pointer;
}

/* 💗 corações */
.coracao {
  position: fixed;
  bottom: 10px;
  font-size: 16px;
  animation: subir 3s ease-out forwards;
  pointer-events: none;
}

@keyframes subir {
  0% { transform: translateY(0); opacity: 1; }
  100% { transform: translateY(-450px); opacity: 0; }
}

</style>
</head>

<body>

<div class="spotify">

  <div class="card">

    <img src="foto.jpg" class="capa">

    <h2>Você & Eu 💚</h2>

    <p class="musica">🎧 Papo de Undaia</p>

    <div class="barra">
      <div class="progresso"></div>
    </div>

    <button class="play" onclick="toggle()">▶</button>

    <div class="contador" id="contador"></div>

    <button class="btn" onclick="abrirCarta()">💌 carta</button>

  </div>

</div>

<!-- 💌 carta -->
<div class="carta" id="carta">
  <div class="carta-box">
    <h3>pra você 💚</h3>
    <p>
      eu te amo mais do que tudo.<br><br>
      você é meu lugar favorito no mundo 🤍
    </p>
    <button class="btn" onclick="fecharCarta()">fechar</button>
  </div>
</div>

<script>

let tocando = false;

/* play */
function toggle() {
  tocando = !tocando;

  for (let i = 0; i < 8; i++) {
    setTimeout(criarCoracao, i * 120);
  }
}

/* coração */
function criarCoracao() {
  const c = document.createElement("div");
  c.classList.add("coracao");
  c.innerText = "💗";
  c.style.left = Math.random() * window.innerWidth + "px";
  document.body.appendChild(c);

  setTimeout(() => c.remove(), 3000);
}

/* carta */
function abrirCarta() {
  document.getElementById("carta").style.display = "flex";

  for (let i = 0; i < 6; i++) {
    setTimeout(criarCoracao, i * 150);
  }
}

function fecharCarta() {
  document.getElementById("carta").style.display = "none";
}

/* contador */
function atualizarContador() {
  const inicio = new Date(2026, 3, 14);
  const agora = new Date();

  const dias = Math.floor((agora - inicio) / (1000 * 60 * 60 * 24));

  document.getElementById("contador").innerText =
    `💚 ${dias} dias juntos`;
}

atualizarContador();
setInterval(atualizarContador, 60000);

</script>

</body>
</html>
